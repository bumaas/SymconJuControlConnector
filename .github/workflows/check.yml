name: Check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # tests/stubs (symcon/SymconStubs, gepinnt)

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: PHP syntax
        run: |
          php -l JuControlDevice/module.php
          php -l tests/harness.php
          php -l tests/check-incomplete-devicedata.php
          php -l tests/check-salt-refill.php
          php -l tests/check-webclient-response.php
          php -l libs/WebClient.php

      - name: Code style (schlankes eigenes Regelwerk, siehe .php-cs-fixer.php)
        run: |
          wget -q https://cs.symfony.com/download/php-cs-fixer-v3.phar
          PHP_CS_FIXER_IGNORE_ENV=1 php php-cs-fixer-v3.phar fix --dry-run --diff --using-cache=no --allow-risky=yes

      - name: JSON validity
        run: |
          find . -name '*.json' -not -path './.git/*' -not -path './tests/stubs/*' -print0 |
            xargs -0 -n1 php -r 'json_decode(file_get_contents($argv[1]), false, 512, JSON_THROW_ON_ERROR); echo $argv[1], " ok\n";' --

      - name: Incomplete device data regression test
        run: php tests/check-incomplete-devicedata.php

      - name: Salt refill and device type in commands
        run: php tests/check-salt-refill.php

      - name: WebClient response splitting
        run: php tests/check-webclient-response.php
